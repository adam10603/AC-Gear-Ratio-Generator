<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>AC Gear Ratio Generator ⚙️</title>
    <link rel="stylesheet" type="text/css" href="css.css">
    <script type="text/javascript" src="chart.js"></script>

<body onload="initPage()">
    <a href="https://github.com/adam10603/AC-Gear-Ratio-Generator">

                </table>
            </td>
            <td id="upper_table_col_2" class="deleteWhenSmall">
                <canvas id="graph_canvas"></canvas>
            </td>
        </tr>
    </table>

    <table id="outputs_table" class="invisible">
    </table>

</html>
